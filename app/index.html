<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Data Quality</title>
<style>body{font:16px system-ui;background:#f4f7fb;color:#182536;margin:0}.wrap{max-width:1000px;margin:40px auto;padding:24px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 20px #10204012;margin:16px 0}h1{margin-bottom:4px}input,button{padding:12px;border:1px solid #ccd6e2;border-radius:8px;font:inherit}input{width:min(480px,60%)}button{background:#176b57;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{border-top:1px solid #e7edf2;padding:14px 0}.muted{color:#687789}a{color:#176b57}</style></head>
<body><main class="wrap"><h1>Product Data Quality</h1><p class="muted">Open Food Facts sample · 5,000 records · GS1 check digit and completeness audit</p><div class="card"><h2>Search by barcode</h2><input id="barcode" placeholder="Enter barcode"><button onclick="search()">Search</button><div id="result"></div></div><div class="card"><h2>Browse products</h2><div><input id="brand" placeholder="Brand filter"><input id="min" type="number" min="0" max="100" value="0" style="width:100px"><button onclick="browse()">Apply filters</button></div><div id="list"></div></div><p><a href="/docs">API documentation</a></p></main>
<script>async function search(){let b=document.querySelector('#barcode').value;let box=document.querySelector('#result');try{let r=await fetch('/products/'+encodeURIComponent(b));let d=await r.json();if(!r.ok)throw Error(d.detail);box.innerHTML=`<div class="item"><b>${d.product_name||'Unnamed product'}</b><p>Brand: ${d.brands||'—'} · Score: ${d.completeness_score}% · Barcode valid: ${d.barcode_valid?'Yes':'No'}</p><small>${d.code||d.barcode||b}</small></div>`}catch(e){box.textContent=e.message}}</script>
<script>async function browse(){let p=new URLSearchParams({page_size:25,brand:document.querySelector('#brand').value,min_score:document.querySelector('#min').value});let d=await(await fetch('/products?'+p)).json();document.querySelector('#list').innerHTML=`<p class="muted">${d.total} matches</p>`+d.items.map(x=>`<div class="item"><b>${x.product_name||'Unnamed product'}</b> · ${x.brands||'Unknown brand'}<br><small>Score ${x.completeness_score}% · Barcode ${x.code||x.barcode||x._id} · valid ${x.barcode_valid?'yes':'no'}</small></div>`).join('')}</script><script>browse()</script></body></html>
